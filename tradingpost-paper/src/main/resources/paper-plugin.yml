name: TradingPost
version: '1.0.0'
main: dev.mintychochip.tradingpost.TradingPostPlugin
api-version: '26.2'
author: jlo
load: POSTWORLD

libraries:
  - com.zaxxer:HikariCP:6.2.1
  - org.postgresql:postgresql:42.7.5
  - com.mysql:mysql-connector-j:9.3.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.3
  - org.xerial:sqlite-jdbc:3.49.1.0

dependencies:
  server:
    Mint:
      load: BEFORE
      required: true
      join-classpath: true

commands:
  post:
    description: Open the nearby villager Trading Post
    usage: /post [market]
    permission: tradingpost.use
  postadmin:
    description: Manage Trading Post markets and posts
    usage: /postadmin <market|post> ...
    permission: tradingpost.admin

permissions:
  tradingpost.use:
    default: true
  tradingpost.admin:
    default: op
